# PearyOS glass compositor, FULL effects (needs working OpenGL: a GPU, or a VM with 3D).
# Frosted blur behind translucent surfaces, soft shadows, rounded windows.
backend = "glx";
vsync = true;
use-damage = false;
glx-no-stencil = true;

# --- frosted-glass blur -------------------------------------------------
blur-method = "dual_kawase";
blur-strength = 7;
blur-background-exclude = [
  "window_type = 'desktop'",
  "class_g = 'Plank'",
  "_GTK_FRAME_EXTENTS@:c"
];

# --- shadows ------------------------------------------------------------
shadow = true;
shadow-radius = 26;
shadow-opacity = 0.38;
shadow-offset-x = -26;
shadow-offset-y = -18;
shadow-exclude = [
  "window_type = 'desktop'",
  "window_type = 'dock'",
  "class_g = 'Plank'",
  "class_g = 'Xfce4-panel'",
  "_GTK_FRAME_EXTENTS@:c"
];

# --- rounded corners ----------------------------------------------------
corner-radius = 14;
rounded-corners-exclude = [
  "window_type = 'desktop'",
  "window_type = 'dock'",
  "class_g = 'Plank'",
  "class_g = 'Xfce4-panel'",
  "class_g = 'Xfdesktop'",
  "_NET_WM_STATE@:32a *= '_NET_WM_STATE_FULLSCREEN'",
  "_NET_WM_STATE@:32a *= '_NET_WM_STATE_MAXIMIZED_VERT'"
];

# --- smoothness ---------------------------------------------------------
fading = true;
fade-in-step = 0.07;
fade-out-step = 0.07;
fade-delta = 6;
detect-client-opacity = true;
detect-transient = true;
detect-client-leader = true;
mark-wmwin-focused = true;
mark-ovredir-focused = true;
log-level = "warn";

wintypes:
{
  tooltip      = { fade = true; shadow = true; opacity = 0.96; focus = true; full-shadow = false; };
  dock         = { shadow = false; clip-shadow-above = true; };
  dnd          = { shadow = false; };
  popup_menu   = { shadow = true; };
  dropdown_menu = { shadow = true; };
};
