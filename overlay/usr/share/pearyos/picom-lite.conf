# PearyOS glass compositor, LITE effects (no OpenGL needed: software rendering, plain VMs, emulation).
# Same translucent glass surfaces, rounded windows and shadows, but no background blur.
backend = "xrender";
vsync = false;

shadow = true;
shadow-radius = 22;
shadow-opacity = 0.34;
shadow-offset-x = -22;
shadow-offset-y = -14;
shadow-exclude = [
  "window_type = 'desktop'",
  "window_type = 'dock'",
  "class_g = 'Plank'",
  "class_g = 'Xfce4-panel'",
  "_GTK_FRAME_EXTENTS@:c"
];

corner-radius = 14;
rounded-corners-exclude = [
  "window_type = 'desktop'",
  "window_type = 'dock'",
  "class_g = 'Plank'",
  "class_g = 'Xfce4-panel'",
  "class_g = 'Xfdesktop'",
  "_NET_WM_STATE@:32a *= '_NET_WM_STATE_FULLSCREEN'",
  "_NET_WM_STATE@:32a *= '_NET_WM_STATE_MAXIMIZED_VERT'"
];

fading = true;
fade-in-step = 0.09;
fade-out-step = 0.09;
fade-delta = 8;
detect-client-opacity = true;
detect-transient = true;
detect-client-leader = true;
mark-wmwin-focused = true;
mark-ovredir-focused = true;
log-level = "warn";

wintypes:
{
  tooltip      = { fade = true; shadow = true; opacity = 0.96; focus = true; full-shadow = false; };
  dock         = { shadow = false; clip-shadow-above = true; };
  dnd          = { shadow = false; };
  popup_menu   = { shadow = true; };
  dropdown_menu = { shadow = true; };
};
