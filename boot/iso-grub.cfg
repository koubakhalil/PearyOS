set default=0
set timeout=6

if loadfont /boot/grub/fonts/unicode.pf2 ; then
  set gfxmode=auto
  insmod efi_gop
  insmod gfxterm
  terminal_output gfxterm
fi

set menu_color_normal=white/black
set menu_color_highlight=black/light-cyan

menuentry "PearyOS (live session)" {
  linux /casper/vmlinuz boot=casper quiet loglevel=3 ---
  initrd /casper/initrd
}

menuentry "PearyOS (glass effects off - use this if the desktop feels slow)" {
  linux /casper/vmlinuz boot=casper quiet loglevel=3 pearyos.glass=off ---
  initrd /casper/initrd
}

menuentry "PearyOS (safe graphics - use this if the screen stays black)" {
  linux /casper/vmlinuz boot=casper nomodeset pearyos.glass=off ---
  initrd /casper/initrd
}

menuentry "PearyOS (load into RAM - USB can be removed afterwards, needs 4 GB+ RAM)" {
  linux /casper/vmlinuz boot=casper toram quiet loglevel=3 ---
  initrd /casper/initrd
}

menuentry "UEFI firmware settings" {
  fwsetup
}
